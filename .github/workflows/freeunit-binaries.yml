name: freeunit-binaries

# Builds prebuilt `unitd` + `libunit.a` per platform so SNUnit users don't have
# to compile FreeUnit from sources.
on:
  workflow_dispatch:
    inputs:
      freeunit_ref:
        description: "FreeUnit commit or tag to build. Empty uses the commit pinned in .github/freeunit-ref"
        required: false
      release_tag:
        description: "Also attach the archives to this existing release (for example freeunit-872bf041), to add a platform to it"
        required: false
      release_files:
        description: "Which archives to attach with release_tag (default: all). For example dist/*macos-x86_64*.tar.gz"
        required: false
  push:
    tags:
      - "freeunit-*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
          - runner: ubuntu-22.04-arm
          - runner: macos-14
          - runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      FREEUNIT_REF: ${{ inputs.freeunit_ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcre2-dev libssl-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pcre2 openssl@3
      - name: Build FreeUnit
        run: bash .github/scripts/build-freeunit.sh
      - uses: actions/upload-artifact@v4
        with:
          name: freeunit-${{ matrix.runner }}
          path: dist/*.tar.gz

  # FreeUnit has to be built on musl to be linked statically: an Alpine container on the x86_64 and aarch64 runners.
  build-musl:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      FREEUNIT_REF: ${{ inputs.freeunit_ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Build FreeUnit (musl)
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e FREEUNIT_REF alpine:3.23 sh -ec '
            apk add --no-cache bash curl tar build-base linux-headers pkgconf rust cargo \
              pcre2-dev pcre2-static openssl-dev openssl-libs-static
            bash .github/scripts/build-freeunit.sh
          '
      - name: Check unitd is static
        run: |
          mkdir check && tar xzf dist/freeunit-*-linux-musl-*.tar.gz -C check
          file check/*/unitd
          file check/*/unitd | grep -q -E "statically linked|static-pie linked"
      - uses: actions/upload-artifact@v4
        with:
          name: freeunit-musl-${{ matrix.runner }}
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/freeunit-') || inputs.release_tag != ''
    needs: [build, build-musl]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: ${{ inputs.release_files || 'dist/*.tar.gz' }}
