name: ci

on: push

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - uses: coursier/cache-action@v6
      - name: out folder cache
        uses: actions/cache@v3
        with:
          path: ./out
          key: out-folder-cache
      - name: Install FreeUnit
        run: bash .github/scripts/install-freeunit.sh
      - name: Download dependencies
        run: |
          ./mill __.prepareOffline
      - name: Check formatting
        run: |
          ./mill mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll __.sources
          ./mill --meta-level 1 mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll __.sources
      # - name: Check scalafix
      #   run: ./mill __.fix --check
      - name: Compile
        run: ./mill __.compile
      - name: Publish libraries locally
        run: ./mill __.publishLocal
      - name: Run Unit Tests
        run: ./mill snunit.test
      - name: Run Integration Tests
        run: ./mill integration.test
  cli:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Install scalino
        run: curl -fsSL https://raw.githubusercontent.com/lolgab/scalino/main/install.sh | bash
      - name: Install FreeUnit build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libpcre2-dev libssl-dev
      - name: Install FreeUnit build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pcre2 openssl@3
      - name: Build FreeUnit
        run: |
          OUT_DIR=$PWD/dist bash .github/scripts/build-freeunit.sh
          mkdir freeunit-bin
          tar xzf dist/freeunit-*.tar.gz -C dist
          cp dist/freeunit-*/unitd dist/freeunit-*/libunit.a freeunit-bin/
      - name: Publish snunit locally
        run: ./mill snunit.publishLocal
      - name: Build snunit CLI
        run: |
          export PATH=$HOME/.local/bin:$PATH
          scalino package snunit-cli/snunit.scala -o snunit
      - name: Smoke test
        run: bash .github/scripts/cli-smoke-test.sh
        env:
          SNUNIT_FREEUNIT_DIR: ${{ github.workspace }}/freeunit-bin

  check-binary-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Check Binary Compatibility
        run: ./mill __.mimaReportBinaryIssues

  publish-sonatype:
    if: github.repository == 'lolgab/snunit' && contains(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    env:
      PGP_PASSPHRASE: ${{ secrets.SONATYPE_PGP_PRIVATE_KEY_PASSWORD }}
      PGP_SECRET: ${{ secrets.SONATYPE_PGP_PRIVATE_KEY }}
      SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      LANG: "en_US.UTF-8"
      LC_MESSAGES: "en_US.UTF-8"
      LC_ALL: "en_US.UTF-8"
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v6
      - name: Compilation cache
        uses: actions/cache@v2
        with:
          path: ./out
          key: out
      - run: ./mill mill.javalib.SonatypeCentralPublishModule/publishAll
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
