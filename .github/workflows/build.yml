name: ci

on: push

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - uses: coursier/cache-action@v6
      - name: out folder cache
        uses: actions/cache@v3
        with:
          path: ./out
          key: out-folder-cache
      - name: Install FreeUnit
        run: bash .github/scripts/install-freeunit.sh
      # fs2-io TLS (the OTLP exporter of otel4s) links s2n, which Ubuntu doesn't package
      - name: Install s2n
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev
          git clone --depth 1 --branch v1.7.12 https://github.com/aws/s2n-tls /tmp/s2n-tls
          cmake -S /tmp/s2n-tls -B /tmp/s2n-tls/build -G Ninja -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/s2n-tls/build
          sudo cmake --install /tmp/s2n-tls/build
          sudo ldconfig
      - name: Download dependencies
        run: |
          ./mill __.prepareOffline
      - name: Check formatting
        run: |
          ./mill mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll __.sources
          ./mill --meta-level 1 mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll __.sources
      # - name: Check scalafix
      #   run: ./mill __.fix --check
      - name: Compile
        run: ./mill __.compile
      - name: Publish libraries locally
        run: ./mill __.publishLocal
      - name: Run Unit Tests
        run: ./mill snunit.test
      - name: Run Integration Tests
        run: ./mill integration.test
  cli:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Check the CLI's FreeUnit commit matches .github/freeunit-ref
        run: grep -q "\"$(tr -d '[:space:]' < .github/freeunit-ref)\"" snunit-build-core/SNUnitBuild.scala
      - name: Check the CLI's stack release matches .github/stack-release
        run: grep -q "\"$(tr -d '[:space:]' < .github/stack-release)\"" snunit-build-core/SNUnitBuild.scala
      - name: Install scalino
        run: curl -fsSL "https://raw.githubusercontent.com/lolgab/scalino/$SCALINO_VERSION/install.sh" | bash
        env:
          SCALINO_VERSION: v0.0.18
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install FreeUnit build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libpcre2-dev libssl-dev
      - name: Install FreeUnit build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pcre2 openssl@3
      - name: Build FreeUnit
        run: |
          OUT_DIR=$PWD/dist bash .github/scripts/build-freeunit.sh
          mkdir freeunit-bin
          tar xzf dist/freeunit-*.tar.gz -C dist
          cp dist/freeunit-*/unitd dist/freeunit-*/libunit.a freeunit-bin/
      - name: Publish snunit locally
        run: ./mill snunit.publishLocal
      - name: Build snunit CLI
        run: |
          export PATH=$HOME/.local/bin:$PATH
          mkdir -p bin
          scalino package snunit-build-core snunit-cli/snunit.scala -o bin/snunit
      - name: Smoke test
        run: |
          export SNUNIT_VERSION="$(./mill --disable-ticker show snunit.publishVersion | tr -d '"')"
          bash .github/scripts/cli-smoke-test.sh
        env:
          SNUNIT_FREEUNIT_DIR: ${{ github.workspace }}/freeunit-bin

  sbt-plugin:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@v1
      - name: Install clang and the FreeUnit runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libpcre2-dev libssl-dev
      - name: Install the FreeUnit runtime libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install pcre2 openssl@3
      # Downloads the prebuilt FreeUnit, so this also tests the download.
      - name: Scripted tests
        run: cd sbt-snunit && sbt +scripted

  check-binary-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Check Binary Compatibility
        run: ./mill __.mimaReportBinaryIssues

  publish-sonatype:
    # `freeunit-*` tags only publish the prebuilt FreeUnit binaries (freeunit-binaries.yml)
    # and `cli-v*` tags only publish the snunit CLI (cli.yml).
    if: github.repository == 'lolgab/snunit' && startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/freeunit-') && !startsWith(github.ref, 'refs/tags/cli-v')
    needs: build
    runs-on: ubuntu-24.04
    env:
      LANG: "en_US.UTF-8"
      LC_MESSAGES: "en_US.UTF-8"
      LC_ALL: "en_US.UTF-8"
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v6
      - name: Compilation cache
        uses: actions/cache@v4
        with:
          path: ./out
          key: out
      - run: |
          # The secret is wrapped over several lines, which Mill's base64 decoder rejects.
          export MILL_PGP_SECRET_BASE64="$(printf %s "$PGP_SECRET" | tr -d '[:space:]')"
          ./mill mill.javalib.SonatypeCentralPublishModule/publishAll
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          MILL_PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
