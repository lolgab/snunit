name: cli

# Releases the `snunit` command line tool, independently of the snunit library
# (which is published to Sonatype from `x.y.z` tags in build.yml).
#
# Push a `cli-vX.Y.Z` tag to publish the binaries as a GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "CLI version, used in the archive names"
        required: false
        default: "0.0.0-dev"
  push:
    tags:
      - "cli-v*"

env:
  SCALINO_VERSION: v0.0.27

jobs:
  build:
    # One Linux machine cross-compiles every target: scalino links all of them in a single run.
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version || '0.0.0-dev' }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: echo "VERSION=${GITHUB_REF_NAME#cli-v}" >> "$GITHUB_ENV"
      - name: Check the CLI's FreeUnit commit matches .github/freeunit-ref
        run: grep -q "\"$(tr -d '[:space:]' < .github/freeunit-ref)\"" snunit-build-core/SNUnitBuild.scala
      - name: Install scalino
        run: |
          sudo apt-get install -y lld
          curl -fsSL "https://raw.githubusercontent.com/lolgab/scalino/$SCALINO_VERSION/install.sh" | bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build snunit for every platform
        run: |
          export PATH=$HOME/.local/bin:$PATH
          scalino package snunit-build-core snunit-cli/snunit.scala -o dist \
            --format tar \
            --pkg-name snunit \
            --pkg-version "$VERSION" \
            --native-mode release-fast \
            --native-target-triple aarch64-apple-darwin,x86_64-apple-darwin,aarch64-unknown-linux-musl,x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: snunit-cli
          path: dist/*

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            triple: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-musl
          - runner: macos-14
            triple: aarch64-apple-darwin
          - runner: macos-15-intel
            triple: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: snunit-cli
          path: dist
      - name: Install scalino
        run: curl -fsSL "https://raw.githubusercontent.com/lolgab/scalino/$SCALINO_VERSION/install.sh" | bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install clang and the FreeUnit runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libpcre2-dev libssl-dev
      - name: Install the FreeUnit runtime libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install pcre2 openssl@3
      - name: Unpack the released binary
        run: |
          mkdir -p bin
          tar xzf dist/snunit-*-${{ matrix.triple }}.tar.gz -C dist
          cp "$(find dist -type f -name snunit)" bin/snunit
          chmod +x bin/snunit
      # No SNUNIT_FREEUNIT_DIR: this also tests the prebuilt FreeUnit download.
      # The CLI doesn't add the snunit dependency: the test program depends on the latest published library.
      # A library release is tagged `x.y.z` and published to Maven Central a few minutes later:
      # wait for the newest tag to be there, so that the test doesn't run against the previous release.
      - name: Wait for the latest snunit release on Maven Central
        run: |
          METADATA=https://repo1.maven.org/maven2/com/github/lolgab/snunit_native0.5_3/maven-metadata.xml
          LATEST_TAG="$(git ls-remote --tags --refs origin '[0-9]*.[0-9]*.[0-9]*' | sed 's:.*refs/tags/::' | sort -V | tail -n1)"
          echo "Waiting for snunit $LATEST_TAG"
          for _ in $(seq 60); do
            if curl -fsSL "$METADATA" | grep -q "<version>$LATEST_TAG</version>"; then
              echo "snunit $LATEST_TAG is on Maven Central"
              exit 0
            fi
            sleep 30
          done
          echo "snunit $LATEST_TAG was not published to Maven Central in 30 minutes" >&2
          exit 1
      - name: Smoke test
        run: |
          export SNUNIT_VERSION="$(curl -fsSL https://repo1.maven.org/maven2/com/github/lolgab/snunit_native0.5_3/maven-metadata.xml | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')"
          echo "SNUNIT_VERSION=$SNUNIT_VERSION"
          bash .github/scripts/cli-smoke-test.sh

  release:
    if: startsWith(github.ref, 'refs/tags/cli-v')
    needs: smoke-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snunit-cli
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
